# Push a tag like v0.1.0 to build Sketchpad, publish a GitHub Release,
# and bump the cask in toddmoy/homebrew-tap.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Build
        run: pnpm dist
        env:
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}

      # One step creates the release and uploads everything, so parallel uploads
      # can't race to create it. On a re-run, replace files on the existing release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=(dist/Sketchpad.dmg dist/Sketchpad.dmg.blockmap dist/Sketchpad-*.zip dist/Sketchpad-*.zip.blockmap dist/latest-mac.yml)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "dist/Sketchpad.dmg" | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/toddmoy/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__SHA256__/${SHA}/" packaging/homebrew/Casks/sketchpad.rb > tap/Casks/sketchpad.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/sketchpad.rb
          git commit -m "sketchpad ${VERSION}"
          git push
